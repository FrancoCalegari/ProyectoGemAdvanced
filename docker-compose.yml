services:
  db:
    image: postgres:18-alpine
    container_name: postgres-academico
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5434:5432"
    volumes:
      - postgres_academico_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - academico_net
    restart: unless-stopped

volumes:
  postgres_academico_data:
    name: postgres_academico_data

networks:
  academico_net:
    name: academico_net